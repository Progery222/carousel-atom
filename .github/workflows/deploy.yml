name: Deploy to atom-server

# Self-hosted CD. atom-server (10.20.87.230) is on a private LAN that GitHub
# cannot reach inbound, so deployment is pulled by a self-hosted runner that
# lives on the server (outbound connection only). A push to main triggers a
# rebuild + restart on the server within seconds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atom-carousel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, carousel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync code to live dir
        run: |
          mkdir -p /home/atom/carousel-atom
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'data' \
            --exclude '.env' \
            ./ /home/atom/carousel-atom/

      - name: Build & (re)start container
        working-directory: /home/atom/carousel-atom
        run: docker compose up -d --build --remove-orphans

      - name: Healthcheck
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8088/health >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "healthcheck failed — last 80 log lines:"
          docker compose -f /home/atom/carousel-atom/docker-compose.yml logs --tail=80
          exit 1

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
